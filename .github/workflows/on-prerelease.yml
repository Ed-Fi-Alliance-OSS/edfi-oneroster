name: On Pre-Release
on:
  release:
    types:
      - prereleased

env:
  API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  REF: ${{ github.ref_name }}

permissions: read-all

jobs:
  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      TAGVERSION: ${{ steps.prepare-tags.outputs.TAGVERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare Tags
        id: prepare-tags
        run: |
          REF="${{ env.REF }}"
          if [[ $REF =~ "Pre-Release" ]]
          then
             # Remove Pre-Release prefix
             PREFIX="Pre-Release-"
             PACKAGEVERSION=${REF#"$PREFIX"}
          else
             PACKAGEVERSION=${REF}
          fi

          if [[ $PACKAGEVERSION =~ "alpha" ]]
          then
            # Pre-releases get the tag "pre"
            APITAGS="${{ env.API_IMAGE_NAME }}:pre"
            TAGVERSION="pre"
          else
            # Releases get the version, plus shortened form for minor release.
            # We are not using shortened form for major or using "latest"
            # because they are too imprecise.
            MINOR=`echo ${PACKAGEVERSION} | awk -F"." '{print $1"."$2}'`
            APITAGS="${{ env.API_IMAGE_NAME }}:${PACKAGEVERSION},${{ env.API_IMAGE_NAME }}:${MINOR}"
            TAGVERSION="${PACKAGEVERSION}"
          fi

          echo "APITAGS=$APITAGS" >> $GITHUB_OUTPUT
          echo "TAGVERSION=$TAGVERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Extract metadata (tags, labels) for one-roster api image
        id: metaapi
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.API_IMAGE_NAME }}
      - name: Build and push one-roster api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          cache-from: type=registry,ref=${{ env.API_IMAGE_NAME }}:pre
          cache-to: type=inline
          platforms: linux/amd64
          file: Dockerfile
          tags: ${{ steps.prepare-tags.outputs.APITAGS }}
          labels: ${{ steps.metaapi.outputs.labels }}
          push: true

  bruno-e2e:
    name: Bruno E2E Tests (${{ matrix.install-type }}, Data Standard ${{ matrix.version }})
    needs: docker-publish
    runs-on: ubuntu-latest
    env:
      ONEROSTER_IMAGE: ${{ vars.API_IMAGE_NAME }}:${{ needs.docker-publish.outputs.TAGVERSION }}
    strategy:
      fail-fast: false
      matrix:
        install-type: [SingleTenant, MultiTenant]
        version: ['4.0.0', '5.2.0', '6.1.0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@3.2.0

      - name: Wait for Docker image to be available
        run: |
          echo "Waiting for Docker image $ONEROSTER_IMAGE to be available..."
          for i in {1..2}; do
            if docker pull "$ONEROSTER_IMAGE"; then
              echo "Docker image is available!"
              exit 0
            fi
            if [ "$i" -lt 2 ]; then
              echo "Attempt $i/2 failed. Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Timed out after 10 seconds waiting for Docker image."
          exit 1

      - name: Run Bruno E2E tests
        shell: pwsh
        env:
          DS_VERSION: ${{ matrix.version }}
          INSTALL_TYPE: ${{ matrix.install-type }}
        run: |
          Write-Host "$env:INSTALL_TYPE - Running Bruno E2E tests for $env:DS_VERSION using image: $env:ONEROSTER_IMAGE"
          ./tests/bruno/run-bruno-e2e.ps1 -Version $env:DS_VERSION -NeedEnvironmentSetup -BrunoConfig "ci.bru" -InstallType $env:INSTALL_TYPE
